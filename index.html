<!doctype html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolo do Caco Fátima — Menú</title>
<meta name="description" content="Bolo do Caco Fátima, C.A. — Bolo do caco cocido sobre piedra, chorizo portugués y doçaria de Madeira. Menú de la panadería.">
<meta name="theme-color" content="#221D1A">

<meta property="og:type" content="website">
<meta property="og:url" content="https://yannabethml.github.io/Menu_BoloDoCaco/">
<meta property="og:title" content="Bolo do Caco Fátima — Menú">
<meta property="og:description" content="El sabor de Madeira, en cada evento.">
<meta property="og:image" content="https://yannabethml.github.io/Menu_BoloDoCaco/assets/img/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/logo-256.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<a class="skip-link" href="#menu">Ir al menú</a>

<!-- ============ CABECERA ============ -->
<header class="topbar" id="topbar">
  <a class="brand" href="#top" aria-label="Bolo do Caco Fátima — inicio">
    <img class="brand__mark" src="assets/img/logo-256.png" alt="" width="256" height="256" decoding="async">
    <span class="brand__text">
      <strong>Bolo do Caco</strong>
      <em>Fátima</em>
    </span>
  </a>

  <div class="langswitch" role="group" aria-label="Idioma / Idioma">
    <button type="button" class="langswitch__btn is-active" data-lang-btn="es" aria-pressed="true">ES</button>
    <button type="button" class="langswitch__btn" data-lang-btn="pt" aria-pressed="false">PT</button>
  </div>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="hero" id="hero">
    <div class="hero__media" id="heroMedia" aria-hidden="true"></div>
    <div class="hero__veil" aria-hidden="true"></div>
    <div class="hero__inner">
      <p class="hero__kicker" data-i18n="site.kicker">Madeira · Venezuela</p>
      <h1 class="hero__title">
        <span class="hero__title-small">O rei da casa</span>
        Bolo do Caco
      </h1>
      <span class="flourish" aria-hidden="true"></span>
      <p class="hero__tagline" data-i18n="site.tagline">El sabor de Madeira, en cada evento</p>
    </div>
    <a class="hero__cue" href="#menu" aria-label="Bajar al menú">
      <span data-i18n="ui.scroll">Desliza</span>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </section>

  <!-- ============ NAV DE CATEGORÍAS (sticky) ============ -->
  <nav class="catnav" id="catnav" aria-label="Categorías del menú">
    <ul class="catnav__list" id="catnavList"></ul>
  </nav>

  <div id="menu">
    <!-- Las secciones del menú se generan aquí desde data/menu.js -->
  </div>

  <!-- ============ EL EVENTO DEL DÍA ============ -->
  <section class="evento" id="evento" aria-labelledby="evento-title" hidden>
    <div class="wrap">
      <p class="kicker" id="eventoKicker"></p>
      <h2 class="section__title" id="evento-title"></h2>
      <span class="flourish flourish--dark" aria-hidden="true"></span>
      <p class="evento__subtitle" id="eventoSubtitle"></p>
      <p class="evento__text" id="eventoText"></p>
      <dl class="facts" id="eventoFacts"></dl>
    </div>
  </section>

</main>

<!-- ============ PIE ============ -->
<footer class="footer">
  <div class="wrap">
    <p class="footer__brand">Bolo do Caco Fátima, C.A.</p>
    <a class="footer__ig" id="footerIg" href="#" target="_blank" rel="noopener"></a>
    <p class="footer__note" data-i18n="ui.priceNote">Precios en dólares</p>
  </div>
</footer>

<!-- ============ BOTÓN FLOTANTE ============ -->
<a class="fab" id="fab" href="#" target="_blank" rel="noopener">
  <span class="fab__icon" id="fabIcon" aria-hidden="true"></span>
  <span class="fab__label" id="fabLabel">Encargar</span>
</a>

<!-- ============ BOTTOM SHEET (detalle de producto) ============ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-sheet-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button class="sheet__close" type="button" data-sheet-close aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="sheet__grip" aria-hidden="true"></span>
    <div class="sheet__media" id="sheetMedia"></div>
    <div class="sheet__body">
      <div class="sheet__badges" id="sheetBadges"></div>
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <p class="sheet__price" id="sheetPrice"></p>
      <p class="sheet__desc" id="sheetDesc"></p>
      <div class="sheet__actions" id="sheetActions"></div>
    </div>
  </div>
</div>

<script src="data/menu.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
